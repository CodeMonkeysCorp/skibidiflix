<div class="login">
    <h1 class="login__title">CADASTRO</h1>
    
    <div class="login__user">
        <label class="user__lable">NOME DE TELA</label>
        <input class="user__input" type="text" [(ngModel)]="nome" name="nome">
    </div>

    <div class="login__user">
        <label class="user__lable">E-MAIL</label>
        <input class="user__input" type="text" [(ngModel)]="email" name="email">
    </div>

    <div class="login__password">
        <label class="password__lable">SENHA</label>
        <input class="password__input" type="password" [(ngModel)]="password">
    </div>

    <div class="login__password">
        <label class="password__lable">CONFIRMAR SENHA</label>
        <input class="password__input" type="password" [(ngModel)]="password_confirm">
    </div>

    <p class="login__sign-in-text">JÁ POSSUI UMA CONTA? <a class="login__sign-in-button" href="/login">ENTRE</a></p>
        
    <button class="login__button" (click)="register()">CADASTRAR</button>
</div>
