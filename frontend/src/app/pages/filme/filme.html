<div *ngIf="movie$ | async as movie" class="filme-container">
  <div *ngIf="toastMessage" class="toast">
    {{ toastMessage }}
  </div>
  
  <!-- Banner de fundo desfocado -->
  <div class="banner-background" 
    [style.backgroundImage]="'url(/images/banners/' + movie.im_path + ')'">
  </div>

  <!-- Conteúdo principal -->
  <div class="filme-content">
    
    <!-- Seção superior com poster e info -->
    <div class="movie-header">
      
      <!-- Poster esquerdo -->
      <div class="movie-poster">
        <img 
          [src]="'/images/capas/' + movie.im_path" 
          [alt]="movie.nm_filme"
          class="poster-image">
      </div>

      <!-- Info direita -->
      <div class="movie-info">
        <h1 class="movie-title">{{ movie.nm_filme }}</h1>
        
        <div class="movie-meta">
          <span class="classificacao">{{ movie.classificacao }}</span>
          <span class="duracao">{{ formatarDuracao(movie.duracao) }}</span>
          <span class="genero">Ação, Ficção Científica</span>
        </div>

        <p class="movie-description" [class.expanded]="descricaoExpandida">
          {{ movie.ds_filme }}
        </p>

        <button *ngIf="!descricaoExpandida" class="btn-continuar" (click)="toggleDescricao()">
          Continuar lendo
        </button>
        <button *ngIf="descricaoExpandida" class="btn-continuar" (click)="toggleDescricao()">
          Comprimir
        </button>

        <div class="movie-actions">
          <button class="btn-action" (click)="abrirReminderModal()">
            <span class="icon">🔖</span>
            Lembre-me
          </button>
          <button class="btn-action" (click)="compartilhar()">
            <span class="icon">🔗</span>
            Compartilhar
          </button>
        </div>
      </div>
    </div>

    <div *ngIf="reminderModalAberto" class="modal-overlay" (click)="fecharReminderModal()">
      <form class="reminder-modal" (click)="$event.stopPropagation()" (ngSubmit)="salvarLembrete(movie)">
        <div class="modal-header">
          <h2>Receber lembrete</h2>
          <button type="button" class="modal-close" (click)="fecharReminderModal()">x</button>
        </div>

        <label class="modal-label" for="reminderDate">Data do lembrete</label>
        <input
          id="reminderDate"
          class="modal-input"
          type="date"
          [(ngModel)]="reminderDate"
          name="reminderDate"
          required>

        <p *ngIf="reminderMessage" class="modal-message">{{ reminderMessage }}</p>

        <div class="modal-actions">
          <button type="button" class="btn-secondary" (click)="fecharReminderModal()">Cancelar</button>
          <button type="submit" class="btn-primary">Enviar lembrete</button>
        </div>
      </form>
    </div>

    <div class="tabs-container">
      <div class="tabs-header">
        <button 
          class="tab-button" 
          [class.active]="activeTab === 'sessoes'"
          (click)="setActiveTab('sessoes')">
          Sessões
        </button>
        <button 
          class="tab-button" 
          [class.active]="activeTab === 'sobre'"
          (click)="setActiveTab('sobre')">
          Sobre o filme
        </button>
      </div>

      <!-- Conteúdo de Sessões -->
      <div *ngIf="activeTab === 'sessoes'" class="tab-content">
        
        <!-- Datas das sessões -->
        <div class="sessoes-datas">
          <button 
            *ngFor="let data of datasSessoes; let i = index"
            class="data-button"
            [class.active]="i === 0"
            (click)="goToSessionMap(data)">
            {{ data }}
          </button>
        </div>

        <!-- Placeholder para sessões -->
        <div class="sessoes-list">
          <p class="placeholder">Selecione uma data para ver as sessões disponíveis</p>
        </div>
      </div>

      <!-- Conteúdo de Sobre -->
      <div *ngIf="activeTab === 'sobre'" class="tab-content">
        <div class="about-section">
          <p>{{ movie.ds_filme }}</p>
        </div>
      </div>
    </div>

  </div>

</div>
